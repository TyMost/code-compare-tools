server:
  port: 8087

spring:
  application:
    name: code-compare-tool-rebuild

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    path: D:\\Coding\\code-compare-tools\\backend\\logs
  level:
    com.example.codecompare.rebuild.agent.CodeBlockMigrationService: DEBUG
    com.example.codecompare.rebuild.scanning: DEBUG
    com.example.codecompare.rebuild.scanning.JGitChangeScanner: DEBUG
    com.example.codecompare.rebuild.diff: DEBUG

migration:
  project:
    # 覆盖演示（projectA-git vs projectB-git）
    sources:
      - code: projectA-git
        path: D:\\Coding\\code-compare-tools\\examples\\projectA-git
    targets:
      - code: projectB-git
        path: D:\\Coding\\code-compare-tools\\examples\\projectB-git
    # 增量 Diff 速查表示例（projectC-git/source-app vs projectC-git/target-app），如需启用请取消注释并注释上方配置
    # sources:
    #   - code: projectC-source-app
    #     path: D:\\Coding\\code-compare-tools\\examples\\projectC-git\\source-app
    # targets:
    #   - code: projectC-target-app
    #     path: D:\\Coding\\code-compare-tools\\examples\\projectC-git\\target-app
  rules:
    path: classpath:config/rules.yaml
    reload-on-change: false
  scan:
    diffEngine: git
    # 覆盖演示（projectA-git vs projectB-git）
    git-base-ref-source: refs/heads/main
    git-target-ref-source: refs/heads/feature/git-demo
    git-base-ref-target: refs/heads/main
    git-target-ref-target: refs/heads/release/git-demo
    # 增量 Diff 速查表示例（projectC-git/source-app vs projectC-git/target-app），如需启用请取消注释并注释上方配置
    # git-base-ref-source: refs/heads/main
    # git-target-ref-source: refs/heads/feature/incremental-demo
    # git-base-ref-target: refs/heads/main
    # git-target-ref-target: refs/heads/feature/incremental-demo
    include-working-tree: true
    since-last-summary: false
    git-fetch-missing-refs: true
    transient-persist: false
    ignore-globs:
      - ".git/**"
      - ".idea/**"
      - "node_modules/**"
      - "build/**"
      - "out/**"
      - "target/**"
      - "dist/**"
      - ".gradle/**"
      - "pom.xml"
      - "*Test.java"
  output:
    report-directory: build/reports/migration
  storage:
    backend: file
    location: build/storage
    file-metadata-dir: file-metadata
    diff-snapshot-dir: diff-snapshots
    block-decision-dir: block-decisions
    agent-suggestion-dir: agent-suggestions
    pretty-print: true
  agent:
    annotation-template: classpath:migration/annotation-template.yml
    enable-replacement-mode: true

