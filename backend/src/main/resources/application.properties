server.port=8081
spring.application.name=migratediff-backend

# 覆盖率算法选择：legacy(默认) 或 strong
coverage.algorithm=strong

# 覆盖率噪音过滤开关
coverage.filter.noise.enabled=true

# 是否跳过unmatched的纯噪音块（import-only、comment-only）
coverage.skip.unmatched.noise.blocks=false

# 覆盖率优化配置
coverage.optimization.enable=true
coverage.optimization.noise-filter.enabled=true
coverage.optimization.noise-filter.similarity-threshold=0.8
coverage.optimization.noise-filter.detail-logging=false

# 完整文件上下文策略配置
coverage.optimization.full-file-context.enabled=true
coverage.optimization.full-file-context.max-file-size=1048576
coverage.optimization.full-file-context.sample-radius=50
coverage.optimization.full-file-context.timeout-ms=5000

# 单向覆盖检测配置
coverage.optimization.full-file-context.update-content=false
coverage.optimization.full-file-context.update-threshold=0.1
coverage.optimization.full-file-context.parallel-search=true
coverage.optimization.full-file-context.parallel-threads=4
coverage.optimization.full-file-context.index-threshold=50000
coverage.optimization.full-file-context.fuzzy-threshold=0.8
coverage.optimization.full-file-context.context-expansion=method

# 发现模式配置
coverage.optimization.full-file-context.discovery.enabled=true
coverage.optimization.full-file-context.discovery.confidence-threshold=0.7
coverage.optimization.full-file-context.discovery.min-content-length=50
coverage.optimization.full-file-context.discovery.timeout-ms=3000

# 原有配置保留
coverage.optimization.full-file-context.min-similarity-threshold=0.3
coverage.optimization.full-file-context.segment-strategy=semantic
coverage.optimization.full-file-context.fixed-segment-lines=20
coverage.optimization.full-file-context.git-cache-ttl=3600
coverage.optimization.full-file-context.git-cache-enabled=true

file.storage.enabled=true
file.storage.root-path=${user.home}/.migratediff/storage

logging.file.path=${user.home}/.migratediff/logs

# 启用详细的快照扫描日志
logging.level.com.example.migratediff.infrastructure.git.IncrementalSnapshotScanner=INFO
logging.level.com.example.migratediff.infrastructure.git.SnapshotLocator=INFO

# 是否导出扫描结果（DiffSummary）到默认存储库
migratediff.export.enabled=true
# 默认扫描策略：SNAPSHOT 表示启用时间窗口快照管线
migratediff.scan.default-strategy=release-auto

# =========================================================
# 导出功能配置
# =========================================================
# 导出文件保存目录
export.temp.directory=${user.home}/.migratediff/exports
# 文件清理时间（小时），默认7天
export.file.cleanup.hours=168
# 最大并发导出任务数
export.max.concurrent.tasks=5
# 同步导出超时时间（秒）
export.sync.timeout.seconds=30

# =========================================================
# Git 扫描模式配置（新增 release-auto 支持）
#  - Example 项目配置：使用 main 作为主分支和 release 分支
#  - 内网项目配置：main 作为主分支，release_* 作为 release 分支
# =========================================================
code-migration.git-scan.main-branches=main
code-migration.git-scan.release-pattern=main

# SSH 私钥配置
migratediff.ssh.enabled=true
migratediff.ssh.private-key=${user.home}/.ssh/id_rsa
migratediff.ssh.passphrase=
migratediff.ssh.known-hosts=${user.home}/.ssh/known_hosts
migratediff.ssh.strict-host-key-checking=true

# =========================================================
# 扫描文件过滤配置
# =========================================================
# 是否启用扫描文件过滤
scan.filter.enabled=true
# 允许的文件扩展名列表（逗号分隔）
scan.filter.file-extensions=.java,.xml,.yml,.yaml,.properties
# 是否排除测试文件（*test.java, *Test.java, *TEST.java）
scan.filter.exclude-test-files=true
# 自定义排除模式列表（逗号分隔，支持通配符）
scan.filter.exclude-patterns=*test.java,*Test.java,*TEST.java

# =========================================================
# Snapshot 时间窗口模式（按需在 application-local.properties 中配置）
#  - 建议将本机路径、私有仓库地址、时间窗口放在本地配置文件中
#  - 可选参数：snapshot-include-remote-refs / snapshot-max-refs 等
# =========================================================
# migratediff.presets[0].name=example
# migratediff.presets[0].source.code=o
# migratediff.presets[0].source.path=/path/to/source/repo
# migratediff.presets[0].source.scan-strategy=release-auto
# migratediff.presets[0].source.time-from=2025-01-01T00:00:00Z
# migratediff.presets[0].source.time-to=2025-01-31T23:59:59Z
#
# migratediff.presets[0].target.code=g
# migratediff.presets[0].target.path=/path/to/target/repo
# migratediff.presets[0].target.scan-strategy=release-auto
# migratediff.presets[0].target.time-from=2025-01-01T00:00:00Z
# migratediff.presets[0].target.time-to=2025-01-31T23:59:59Z
