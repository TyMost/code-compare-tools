migratediff.presets[0].target.time-to=2025-11-05T12:00:00+08:00
migratediff.presets[0].target.ref-hint=refs/heads/g2
migratediff.presets[0].target.delta-type=DELTA_G
migratediff.presets[0].target.include-working-tree=false
migratediff.presets[0].target.fetch-if-missing=true
