server.port=8081
spring.application.name=migratediff-backend

file-storage.enabled=true
file-storage.root-path=${user.home}/.migratediff/storage

logging.file.path=${user.home}/.migratediff/logs

# 是否导出扫描结果（DiffSummary）到默认存储库
migratediff.export.enabled=true
# 默认扫描策略：SNAPSHOT 表示启用时间窗口快照管线
migratediff.scan.default-strategy=SNAPSHOT

# =========================================================
# 性能优化配置
# =========================================================
# Repository缓存池配置
migratediff.performance.enable-repository-pool=true
migratediff.performance.repository-pool-size=10
migratediff.performance.cache-repository-seconds=300

# RevWalk池配置
migratediff.performance.enable-revwalk-pool=true
migratediff.performance.revwalk-pool-size=5
migratediff.performance.revwalk-borrow-timeout-ms=5000

# 并行处理配置
migratediff.performance.parallel-scan=true
migratediff.performance.parallel-ref-processing=true
migratediff.performance.max-concurrent-refs=8

# 性能监控配置
migratediff.performance.monitoring.enabled=true

# SSH 私钥配置
migratediff.ssh.enabled=true
migratediff.ssh.private-key=${user.home}/.ssh/id_rsa
migratediff.ssh.passphrase=
migratediff.ssh.known-hosts=${user.home}/.ssh/known_hosts
migratediff.ssh.strict-host-key-checking=true

# =========================================================
# Snapshot 时间窗口模式（默认启用）
#  - 必填：repo-path、time-from、time-to、scan-strategy=SNAPSHOT
#  - 可选：snapshot-include-remote-refs / snapshot-max-refs 等性能参数
# =========================================================
migratediff.presets[0].name=default-og-snapshot
migratediff.presets[0].source.code=o-g
migratediff.presets[0].source.path=D:\\Coding\\code-compare-tools\\examples\\o
migratediff.presets[0].source.scan-strategy=SNAPSHOT
migratediff.presets[0].source.time-from=2025-11-01T00:00:00+08:00
migratediff.presets[0].source.time-to=2025-11-25T12:00:00+08:00
migratediff.presets[0].source.ref-hint=refs/heads/o2
migratediff.presets[0].source.branch-from=
migratediff.presets[0].source.branch-to=
migratediff.presets[0].source.delta-type=DELTA_O
migratediff.presets[0].source.include-working-tree=false
migratediff.presets[0].source.fetch-if-missing=true
migratediff.presets[0].source.remote-name=origin
migratediff.presets[0].source.snapshot-include-remote-refs=false
migratediff.presets[0].source.snapshot-include-tags=false
migratediff.presets[0].source.snapshot-max-refs=256

migratediff.presets[0].target.code=g
migratediff.presets[0].target.path=D:\\Coding\\code-compare-tools\\examples\\g
migratediff.presets[0].target.scan-strategy=SNAPSHOT
migratediff.presets[0].target.time-from=2025-11-01T00:00:00+08:00
migratediff.presets[0].target.time-to=2025-11-25T00:00:00+08:00
migratediff.presets[0].target.ref-hint=refs/heads/g2,refs/heads/g1
migratediff.presets[0].target.branch-from=
migratediff.presets[0].target.branch-to=
migratediff.presets[0].target.delta-type=DELTA_G
migratediff.presets[0].target.include-working-tree=false
migratediff.presets[0].target.fetch-if-missing=true
migratediff.presets[0].target.remote-name=origin
migratediff.presets[0].target.snapshot-include-remote-refs=false
migratediff.presets[0].target.snapshot-include-tags=false
migratediff.presets[0].target.snapshot-max-refs=256

