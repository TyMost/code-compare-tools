  - id: drop-block-comments
    type: block-filter
    displayName: "Ignore /* */ comments"
    params:
      pattern: "(?s)^\\s*/\\*.*?\\*/\\s*$"
      ignoreSynthetic: true
      filterAction: drop
      applyTo: either
      priority: 1000
  - id: drop-blank-blocks
    type: block-filter
    displayName: "Ignore blank blocks"
    params:
      filterAction: drop
      ignoreSynthetic: true
      applyTo: both
      priority: 1000
  - id: drop-orphan-import-source
    type: block-filter
    displayName: "Ignore removed import"
    params:
      pattern: "(?s)^\\s*import\\b.*$"
      filterAction: drop
      ignoreSynthetic: true
      applyTo: source
      priority: 995
  - id: drop-orphan-import-target
    type: block-filter
    displayName: "Ignore added import"
    params:
      pattern: "(?s)^\\s*import\\b.*$"
      filterAction: drop
      ignoreSynthetic: true
      applyTo: target
      priority: 995
  - id: replace-syntax
    type: field-replace
    displayName: "语法重构"
    params:
      from: "LEGACY::"
      to: "encoder.encode"
      label: "语法重构"
      minCount: 1
      priority: 900
      color: "#E6A23C"
  - id: replace-decode
    type: field-replace
    displayName: "分片解码重构"
    params:
      from: "token.substring"
      to: "encoder.decodeTenant"
      label: "分片解码重构"
      minCount: 1
      priority: 850
      color: "#67C23A"
  - id: feature-flag-refactor
    type: field-replace
    displayName: "特性开关重构"
    params:
      from: "setNewCheckout"
      to: "override"
      label: "特性开关重构"
      minCount: 1
      priority: 1
      color: "#409EFF"
  - id: channel-mapping-refactor
    type: field-replace
    displayName: "渠道映射重构"
    params:
      from: "new HashMap"
      to: "Map.copyOf"
      label: "渠道映射重构"
      minCount: 1
      priority: 1
      color: "#AF52DE"
  - id: similarity-low
    type: similarity
    displayName: "未迁移"
    params:
      threshold: 30
      comparison: below
      label: "未迁移"
      priority: 1
      statusKey: "unmigrated"
      color: "#F56C6C"
  - id: similarity-partial
    type: similarity
    displayName: "适配迁移"
    params:
      minThreshold: 30
      maxThreshold: 100
      comparison: between
      label: "适配迁移"
      priority: 1
      statusKey: "adapt_migration"
      color: "#409EFF"
  - id: presence-target-only
    type: presence
    displayName: "目标新增适配"
    params:
      requireExistsInA: false
      requireExistsInB: true
      matchTypes:
        - INSERT
      label: "目标新增适配"
      priority: 2
      statusKey: "new_adapt_migration"
      color: "#409EFF"
  - id: similarity-high
    type: similarity
    displayName: "已迁移"
    params:
      threshold: 100
      comparison: at-least
      label: "已迁移"
      priority: 1100
      statusKey: "migrated"
      color: "#67C23A"
  - id: annotation-migrated
    type: annotation-marker
    displayName: "迁移代码块"
    params:
      mode: "both"
      label: "迁移代码块"
      statusKey: "annotation_migrated"
      priority: 1200
      color: "#67C23A"
      startMarker: "/** 迁移生成的代码片段开始 */"
      endMarker: "/** 迁移生成的代码片段结束 */"
  - id: annotation-partial
    type: annotation-marker
    displayName: "自动迁移适配"
    params:
      mode: "any"
      label: "自动迁移适配"
      statusKey: "annotation_partial"
      priority: 1150
      color: "#409EFF"
      startMarker: "/** 迁移生成的代码片段开始 */"
      endMarker: "/** 迁移生成的代码片段结束 */"
